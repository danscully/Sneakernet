name: Desktop builds (Tauri)

# Builds the Sneakernet desktop app (Option A in DeployProposal.md) for
# distribution: macOS .app/.dmg (arm64) and Windows MSI/NSIS installers (x64).
# Artifacts are uploaded on every run; tag pushes additionally draft a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            targets: ''
            artifact: Sneakernet-macOS-arm64
            bundles: dmg
          - os: windows-latest
            targets: ''
            artifact: Sneakernet-Windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app + native addon
        run: npm run build

      - name: Assemble desktop resources (server bundle, addon, Node runtime)
        run: node scripts/prepare-desktop.mjs

      - name: Build desktop app
        run: npx tauri build --config desktop/src-tauri/tauri.conf.json --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installers to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
