[package]
name = "sneakernet"
version = "0.1.2"
description = "Sneakernet desktop shell - launches and supervises the local sync server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
# Strip the Windows \\?\ verbatim prefix from Tauri's managed paths (Node
# rejects verbatim paths when resolving its main module).
dunce = "1"

[profile.release]
# Keep the shell binary lean; all the heavy lifting happens in the Node server.
opt-level = "s"
