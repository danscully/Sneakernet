[package]
name = "metfilesync"
version = "0.1.0"
description = "MetFileSync desktop shell - launches and supervises the local sync server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
# Keep the shell binary lean; all the heavy lifting happens in the Node server.
opt-level = "s"
